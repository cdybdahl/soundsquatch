# A release: push a tag such as v0.9.1 (its number matching VERSION in soundsquatch.py). This builds the image for
# 64-bit Intel/AMD and ARM (a Raspberry Pi 4 or 5, an Apple-silicon Mac), publishes it as
# ghcr.io/cdybdahl/soundsquatch:<number> and :latest, and makes the GitHub release that Soundsquatch's own update check reads.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version
        run: grep -q "VERSION = \"${GITHUB_REF_NAME#v}[ \"]" soundsquatch.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cdybdahl/soundsquatch:${{ github.ref_name }}
            ghcr.io/cdybdahl/soundsquatch:latest
          labels: |
            org.opencontainers.image.source=https://github.com/cdybdahl/soundsquatch
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
      - name: The release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Soundsquatch ${GITHUB_REF_NAME#v}" --generate-notes --prerelease=false
